name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CONTAINER: pieceful
  # Host port on the server (container listens on 8080).
  APP_PORT: '6060'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: go vet
        working-directory: server
        run: |
          # go:embed needs at least one file in dist/ (the real site is built in the Docker image)
          mkdir -p dist && touch dist/.gitkeep
          go vet ./...

  image:
    name: Build & push image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: read
    environment:
      name: production
      url: http://${{ vars.DEPLOY_HOST || '167.233.87.63' }}:6060
    steps:
      - name: Check deploy secrets
        id: check
        env:
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          USER: ${{ secrets.SSH_USER }}
        run: |
          if [ -z "$KEY" ] || [ -z "$USER" ]; then
            echo "::warning::SSH_PRIVATE_KEY / SSH_USER secrets are not set — skipping deploy. See README → Deployment."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Normalise the pasted key (Windows line endings, missing final newline) into a file.
          umask 077
          printf '%s\n' "$KEY" | tr -d '\r' > "$RUNNER_TEMP/deploy_key"
          if grep -q -- '^ssh-\(ed25519\|rsa\|ecdsa\)' "$RUNNER_TEMP/deploy_key"; then
            echo "::error::SSH_PRIVATE_KEY contains a PUBLIC key (the .pub file). Paste the private key instead: the output of 'cat ~/.ssh/pieceful_deploy' (no .pub)."
            exit 1
          fi
          complete() { grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$1" && grep -q -- '-----END .*PRIVATE KEY-----' "$1"; }
          # Also accept the key as a single base64 line (output of: base64 -w0 ~/.ssh/pieceful_deploy).
          if ! complete "$RUNNER_TEMP/deploy_key"; then
            printf '%s' "$KEY" | tr -d '\r\n\t ' | base64 -d > "$RUNNER_TEMP/deploy_key.b64" 2>/dev/null || true
            if [ -s "$RUNNER_TEMP/deploy_key.b64" ] && complete "$RUNNER_TEMP/deploy_key.b64"; then
              tr -d '\r' < "$RUNNER_TEMP/deploy_key.b64" > "$RUNNER_TEMP/deploy_key"
              echo "Using base64-encoded SSH_PRIVATE_KEY"
            fi
            rm -f "$RUNNER_TEMP/deploy_key.b64"
          fi
          if ! complete "$RUNNER_TEMP/deploy_key"; then
            f="$RUNNER_TEMP/deploy_key"
            yn() { if grep -q -- "$1" "$f"; then echo yes; else echo no; fi; }
            # Safe diagnostics only: sizes and markers, never the key material.
            echo "SSH_PRIVATE_KEY diagnostics: lines=$(wc -l < "$f") chars=$(wc -c < "$f") has_BEGIN=$(yn '-----BEGIN') has_END=$(yn '-----END') has_PRIVATE_KEY=$(yn 'PRIVATE KEY')"
            echo "::error::SSH_PRIVATE_KEY is not a complete private key. Paste the whole output of 'cat ~/.ssh/pieceful_deploy' (including the -----BEGIN … and -----END … lines), or the single line printed by 'base64 -w0 ~/.ssh/pieceful_deploy'."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Pull & restart container over SSH
        if: steps.check.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ needs.image.outputs.tag }}
          IMAGE: ${{ env.IMAGE }}
          CONTAINER: ${{ env.CONTAINER }}
          APP_PORT: ${{ env.APP_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.DEPLOY_HOST || '167.233.87.63' }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          envs: IMAGE_REF,IMAGE,CONTAINER,APP_PORT,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            echo "Connected to $(hostname)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"
            docker logout ghcr.io

            docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
            docker run -d --name "$CONTAINER" \
              --restart unless-stopped \
              -p "$APP_PORT:8080" \
              --log-opt max-size=10m --log-opt max-file=3 \
              "$IMAGE_REF"

            # Wait for the container's health check.
            for i in $(seq 1 30); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then echo "Pieceful is healthy on port $APP_PORT"; break; fi
              if [ "$i" = 30 ]; then echo "Container did not become healthy"; docker logs --tail 50 "$CONTAINER"; exit 1; fi
              sleep 2
            done

            # Keep only the running Pieceful image (+ a couple of previous ones for rollback).
            docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}}' | grep -v ':latest$' | grep -vx "$IMAGE_REF" | tail -n +3 | xargs -r docker rmi >/dev/null 2>&1 || true
